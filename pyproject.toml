[build-system]
requires = ["hatchling"]
backend-path = []
build-backend = "hatchling.build"

[project]
name = "ci-test-python-cli"
version = "0.0.1"
description = "Minimal Python CLI for testing HyperI CI pipelines"
requires-python = ">=3.9"
license = "FSL-1.1-ALv2"
authors = [
    { name = "HYPERI PTY LIMITED" },
]

[project.scripts]
ci-test-cli = "ci_test_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_test_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
