#
# Python application variant in the hyperi-ci test matrix. Sibling repo:
#   ci-test-python-lib  — library variant (no Dockerfile, auto-skip)
#
# App variant — has [project.scripts] entry + Dockerfile, exercises the
# custom-mode container build path (Dockerfile detected -> buildx -> GHCR).

language: python

quality:
  enabled: true

test:
  enabled: true

build:
  enabled: true
  type: app
  strategies:
    - native

publish:
  enabled: true
  target: oss
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
